<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summarify AI</title>

    <link rel="stylesheet" href="/static/style.css">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-brain"></i>
            Summarify AI
        </div>

        <ul>
            <li>Home</li>
            <li>Features</li>
            <li>AI Notes</li>
            <li>Contact</li>
        </ul>
    </nav>


    <section class="hero">

        <div class="left">
            <h1>
                AI Powered
                Study Summaries
            </h1>

            <p>
                Upload PDF, DOCX or PPT files and get instant
                AI generated summaries, key concepts and notes.
            </p>

            <div class="upload-box">

                <textarea
                    id="notes"
                    placeholder="Paste your notes here..."
                ></textarea>

                <input type="file" id="fileInput">

                <button onclick="generateSummary()">
                    Generate AI Summary
                </button>

            </div>
        </div>


        <div class="right">

            <div class="glass-card">
                <h2>
                    AI Summary
                </h2>

                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    Generating intelligent summary...
                </div>

                <div id="result">
                    Your AI summary will appear here...
                </div>
            </div>

        </div>

    </section>


<script src="/static/script.js"></script>
</body>
</html>
